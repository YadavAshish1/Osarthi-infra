name: Terraform CI/CD

on:
  pull_request:
    branches:
      - main
      - uat

  push:
    branches:
      - main
      - uat

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: "1.9.8"

  ARM_USE_OIDC: true
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:

  # ============================================================
  # 1. DETERMINE ENVIRONMENT
  # ============================================================

  setup:
    name: Determine Environment
    runs-on: ubuntu-latest

    outputs:
      environment: ${{ steps.env.outputs.environment }}
      working_dir: ${{ steps.env.outputs.working_dir }}

    steps:

      - name: Determine Terraform Environment
        id: env
        shell: bash
        run: |

          if [[ "${{ github.base_ref }}" == "uat" ]]; then
            echo "environment=uat" >> "$GITHUB_OUTPUT"
            echo "working_dir=environments/uat" >> "$GITHUB_OUTPUT"

          elif [[ "${{ github.ref }}" == "refs/heads/uat" ]]; then
            echo "environment=uat" >> "$GITHUB_OUTPUT"
            echo "working_dir=environments/uat" >> "$GITHUB_OUTPUT"

          else
            echo "environment=prod" >> "$GITHUB_OUTPUT"
            echo "working_dir=environments/prod" >> "$GITHUB_OUTPUT"
          fi


  # ============================================================
  # 2. SECURITY + QUALITY SCAN
  # ============================================================

  security-scan:
    name: Security & Quality Scan
    needs: setup
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Setup Terraform
      # --------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # --------------------------------------------------------
      # Terraform Format
      # --------------------------------------------------------

      - name: Terraform Format Check
        run: |
          terraform fmt -check -recursive

      # --------------------------------------------------------
      # Terraform Init
      # Backend disabled for scanning
      # --------------------------------------------------------

      - name: Terraform Init
        working-directory: ${{ needs.setup.outputs.working_dir }}
        run: |
          terraform init -backend=false

      # --------------------------------------------------------
      # Terraform Validate
      # --------------------------------------------------------

      - name: Terraform Validate
        working-directory: ${{ needs.setup.outputs.working_dir }}
        run: |
          terraform validate

      # --------------------------------------------------------
      # TFLint
      # --------------------------------------------------------

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Initialize TFLint
        working-directory: ${{ needs.setup.outputs.working_dir }}
        run: |
          tflint --init

      - name: Run TFLint
        working-directory: ${{ needs.setup.outputs.working_dir }}
        run: |
          tflint

      # --------------------------------------------------------
      # Trivy
      # --------------------------------------------------------

      - name: Trivy IaC Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: ${{ needs.setup.outputs.working_dir }}
          severity: HIGH,CRITICAL
          exit-code: 1

      # --------------------------------------------------------
      # Checkov
      # --------------------------------------------------------

      - name: Checkov Terraform Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: ${{ needs.setup.outputs.working_dir }}
          framework: terraform
          soft_fail: false

      # --------------------------------------------------------
      # Gitleaks
      # --------------------------------------------------------

      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # ============================================================
  # 3. TERRAFORM PLAN
  # ============================================================

  terraform-plan:
    name: Terraform Plan
    needs:
      - setup
      - security-scan

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Setup Terraform
      # --------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # --------------------------------------------------------
      # Azure OIDC Login
      # --------------------------------------------------------

      - name: Azure Login - OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # --------------------------------------------------------
      # Verify Azure
      # --------------------------------------------------------

      - name: Verify Azure Login
        run: |
          az account show

      # --------------------------------------------------------
      # Terraform Init
      # --------------------------------------------------------

      - name: Terraform Init
        working-directory: ${{ needs.setup.outputs.working_dir }}
        run: |
          terraform init

      # --------------------------------------------------------
      # Terraform Validate
      # --------------------------------------------------------

      - name: Terraform Validate
        working-directory: ${{ needs.setup.outputs.working_dir }}
        run: |
          terraform validate

      # --------------------------------------------------------
      # Terraform Plan
      # --------------------------------------------------------

      - name: Terraform Plan
        working-directory: ${{ needs.setup.outputs.working_dir }}
        run: |
          terraform plan \
            -out=tfplan

      # --------------------------------------------------------
      # Terraform Plan JSON
      # --------------------------------------------------------

      - name: Terraform Show
        working-directory: ${{ needs.setup.outputs.working_dir }}
        run: |
          terraform show \
            -json tfplan > tfplan.json

      # --------------------------------------------------------
      # Upload Plan
      # --------------------------------------------------------

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ needs.setup.outputs.environment }}
          path: |
            ${{ needs.setup.outputs.working_dir }}/tfplan
            ${{ needs.setup.outputs.working_dir }}/tfplan.json
          retention-days: 5


  # ============================================================
  # 4. SCAN TERRAFORM PLAN
  # ============================================================

  terraform-plan-scan:
    name: Scan Terraform Plan
    needs:
      - setup
      - terraform-plan

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Download Plan
      # --------------------------------------------------------

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-${{ needs.setup.outputs.environment }}
          path: ${{ needs.setup.outputs.working_dir }}

      # --------------------------------------------------------
      # Checkov Plan Scan
      # --------------------------------------------------------

      - name: Checkov Terraform Plan Scan
        uses: bridgecrewio/checkov-action@master
        with:
          file: ${{ needs.setup.outputs.working_dir }}/tfplan.json
          framework: terraform_plan
          soft_fail: false


  # ============================================================
  # 5. UAT APPLY
  # ============================================================

  terraform-uat-apply:
    name: Terraform Apply - UAT
    needs:
      - setup
      - terraform-plan
      - terraform-plan-scan

    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/uat'

    runs-on: ubuntu-latest

    environment:
      name: uat

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Setup Terraform
      # --------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # --------------------------------------------------------
      # Azure OIDC Login
      # --------------------------------------------------------

      - name: Azure Login - OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # --------------------------------------------------------
      # Terraform Init
      # --------------------------------------------------------

      - name: Terraform Init
        working-directory: ${{ needs.setup.outputs.working_dir }}
        run: |
          terraform init

      # --------------------------------------------------------
      # Download Plan
      # --------------------------------------------------------

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-uat
          path: ${{ needs.setup.outputs.working_dir }}

      # --------------------------------------------------------
      # Terraform Apply
      # --------------------------------------------------------

      - name: Terraform Apply
        working-directory: ${{ needs.setup.outputs.working_dir }}
        run: |
          terraform apply \
            -auto-approve \
            tfplan


  # ============================================================
  # 6. PROD APPLY
  # ============================================================

  terraform-prod-apply:
    name: Terraform Apply - PROD
    needs:
      - setup
      - terraform-plan
      - terraform-plan-scan

    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    # ----------------------------------------------------------
    # Configure approval:
    #
    # GitHub
    # → Settings
    # → Environments
    # → production
    # → Required reviewers
    # ----------------------------------------------------------

    environment:
      name: production

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Setup Terraform
      # --------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # --------------------------------------------------------
      # Azure OIDC Login
      # --------------------------------------------------------

      - name: Azure Login - OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # --------------------------------------------------------
      # Verify Azure Login
      # --------------------------------------------------------

      - name: Verify Azure Login
        run: |
          az account show

      # --------------------------------------------------------
      # Terraform Init
      # --------------------------------------------------------

      - name: Terraform Init
        working-directory: ${{ needs.setup.outputs.working_dir }}
        run: |
          terraform init

      # --------------------------------------------------------
      # Download Exact Plan
      # --------------------------------------------------------

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-prod
          path: ${{ needs.setup.outputs.working_dir }}

      # --------------------------------------------------------
      # Terraform Apply
      # --------------------------------------------------------

      - name: Terraform Apply
        working-directory: ${{ needs.setup.outputs.working_dir }}
        run: |
          terraform apply \
            -auto-approve \
            tfplan