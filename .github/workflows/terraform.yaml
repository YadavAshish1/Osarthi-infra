name: Terraform CI/CD

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: "1.9.8"

  # Azure Terraform Backend
  ARM_USE_OIDC: true
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:

  # ============================================================
  # 1. TERRAFORM SECURITY + QUALITY SCAN
  # ============================================================

  security-scan:
    name: Security & Quality Scan
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Setup Terraform
      # --------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # --------------------------------------------------------
      # Terraform Format
      # --------------------------------------------------------

      - name: Terraform Format Check
        run: |
          terraform fmt -check -recursive

      # --------------------------------------------------------
      # Terraform Init
      # Backend disabled for validation
      # --------------------------------------------------------

      - name: Terraform Init
        run: |
          terraform init -backend=false

      # --------------------------------------------------------
      # Terraform Validate
      # --------------------------------------------------------

      - name: Terraform Validate
        run: |
          terraform validate

      # --------------------------------------------------------
      # TFLint
      # --------------------------------------------------------

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Initialize TFLint
        run: |
          tflint --init

      - name: Run TFLint
        run: |
          tflint --recursive

      # --------------------------------------------------------
      # Trivy IaC Scan
      # --------------------------------------------------------

      - name: Trivy IaC Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 1

      # --------------------------------------------------------
      # Checkov
      # --------------------------------------------------------

      - name: Checkov Terraform Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform
          soft_fail: false

      # --------------------------------------------------------
      # Gitleaks
      # --------------------------------------------------------

      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # ============================================================
  # 2. TERRAFORM PLAN
  # ============================================================

  terraform-plan:
    name: Terraform Plan
    needs: security-scan
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Setup Terraform
      # --------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # --------------------------------------------------------
      # Azure Login using OIDC
      # --------------------------------------------------------

      - name: Azure Login - OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # --------------------------------------------------------
      # Verify Azure Authentication
      # --------------------------------------------------------

      - name: Verify Azure Login
        run: |
          az account show

      # --------------------------------------------------------
      # Terraform Init
      # Azure Storage Backend
      # --------------------------------------------------------

      - name: Terraform Init
        run: |
          terraform init

      # --------------------------------------------------------
      # Terraform Validate
      # --------------------------------------------------------

      - name: Terraform Validate
        run: |
          terraform validate

      # --------------------------------------------------------
      # Terraform Plan
      # --------------------------------------------------------

      - name: Terraform Plan
        run: |
          terraform plan \
            -out=tfplan

      # --------------------------------------------------------
      # Convert Terraform Plan to JSON
      # --------------------------------------------------------

      - name: Terraform Show
        run: |
          terraform show \
            -json tfplan > tfplan.json

      # --------------------------------------------------------
      # Upload Terraform Plan
      # --------------------------------------------------------

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: |
            tfplan
            tfplan.json
          retention-days: 5


  # ============================================================
  # 3. SCAN TERRAFORM PLAN
  # ============================================================

  terraform-plan-scan:
    name: Scan Terraform Plan
    needs: terraform-plan
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Download Plan
      # --------------------------------------------------------

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan

      # --------------------------------------------------------
      # Checkov Plan Scan
      # --------------------------------------------------------

      - name: Checkov Terraform Plan Scan
        uses: bridgecrewio/checkov-action@master
        with:
          file: tfplan.json
          framework: terraform_plan
          soft_fail: false


  # ============================================================
  # 4. TERRAFORM APPLY
  # ============================================================

  terraform-apply:
    name: Terraform Apply
    needs:
      - terraform-plan
      - terraform-plan-scan

    # Apply ONLY on push to main
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    # ----------------------------------------------------------
    # GitHub Environment
    #
    # Configure manual approval in:
    #
    # Repository
    #   → Settings
    #   → Environments
    #   → production
    # ----------------------------------------------------------

    environment:
      name: production

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Setup Terraform
      # --------------------------------------------------------

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # --------------------------------------------------------
      # Azure Login using OIDC
      # --------------------------------------------------------

      - name: Azure Login - OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # --------------------------------------------------------
      # Verify Azure Login
      # --------------------------------------------------------

      - name: Verify Azure Login
        run: |
          az account show

      # --------------------------------------------------------
      # Terraform Init
      # --------------------------------------------------------

      - name: Terraform Init
        run: |
          terraform init

      # --------------------------------------------------------
      # Terraform Apply
      # --------------------------------------------------------

      - name: Terraform Apply
        run: |
          terraform apply \
            -auto-approve